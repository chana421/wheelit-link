<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel It</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #fff;
    }
    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: #444;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e0e0e0;
      border-top-color: #1B3A4B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #1B3A4B; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div>מעבירים אותך להורדה…</div>
    <noscript><a id="fallback-ns" href="#">המשך להורדה</a></noscript>
    <a id="fallback" href="#" style="display:none">לחץ/י כאן אם לא קרה כלום</a>
  </div>

<script>
  // ─── Extract referral code from ?ref=CODE or path /ref/CODE ──────────────
  const qsRef = new URLSearchParams(window.location.search).get('ref');
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const refIdx = pathParts.indexOf('ref');
  const pathRef = (refIdx >= 0 && pathParts.length > refIdx + 1)
                ? pathParts[refIdx + 1]
                : '';
  const code = (qsRef || pathRef || '').trim().toUpperCase();

  // ─── Detect platform ─────────────────────────────────────────────────────
  const ua = navigator.userAgent || '';
  const isIOS     = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /Android/.test(ua);

  // Android: Play Store with install referrer so the app auto-detects after install
  const androidUrl = 'https://play.google.com/store/apps/details?id=com.chana.wheelit'
                   + (code ? '&referrer=ref%3D' + encodeURIComponent(code) : '');
  // iOS: replace APPSTORE_ID with your numeric App Store ID
  const iosUrl     = 'https://apps.apple.com/app/id' + 'APPSTORE_ID';

  const target = isIOS ? iosUrl : androidUrl; // ברירת מחדל: Google Play (גם במחשב)

  // הצג קישור גיבוי למקרה שההפניה נחסמה
  const fb = document.getElementById('fallback');
  if (fb) { fb.href = target; fb.style.display = 'inline'; }

  // הפניה אוטומטית
  window.location.replace(target);
</script>
</body>
</html>
